<style>
:root{color-scheme:dark}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#08030f;color:#fff;font-family:Tajawal,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
#app{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#box{position:relative;width:min(100%,calc(100dvh*16/9));aspect-ratio:16/9;overflow:hidden;container-type:inline-size;font-size:1.65vw;font-size:1.65cqw;background:#000;box-shadow:0 0 60px #ff4b2b33}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{width:100%;height:100%;display:block;touch-action:none}
#box>*:not(canvas){position:absolute}
button{font-family:inherit}
.b{font:900 1.15em Tajawal,system-ui;color:#fff;background:linear-gradient(#ff6a1a,#b01800);border:.18em solid #ffd23f;border-radius:.75em;padding:.42em 1em;box-shadow:0 .25em 0 #500;cursor:pointer;margin:.18em;transition:transform .08s,filter .15s;white-space:nowrap}
.b:hover{filter:brightness(1.12)}.b:active{transform:translateY(.15em);box-shadow:0 .1em 0 #500}
.b.g{background:linear-gradient(#1fc6ff,#0a58b8);border-color:#fff;box-shadow:0 .25em 0 #012}
.b.p{background:linear-gradient(#3b2156,#1d0f2e);border-color:#8a5ad0;box-shadow:0 .25em 0 #0a0414;font-size:1em}
.b.s{font-size:.95em;padding:.3em .8em}
.b.off{background:#333;border-color:#666;box-shadow:0 .25em 0 #111;color:#aaa}
.b.big{font-size:1.5em;padding:.4em 1.6em;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05);filter:brightness(1.15)}}
.b[disabled]{opacity:.6;cursor:default;animation:none}
.ib{top:.6em;right:.6em;width:2.4em;height:2.4em;background:#000a;border:2px solid #fff6;border-radius:.7em;font-size:1.1em;color:#fff;cursor:pointer;z-index:3;display:flex;align-items:center;justify-content:center}
#sk,.mv{bottom:4%;height:4.2em;border:.2em solid #fff;border-radius:1em;color:#fff;font:900 1em Tajawal,system-ui;z-index:2;cursor:pointer;touch-action:none}
#gn{left:1em;bottom:calc(4% + 5em)!important;min-width:7.5em;padding:0 .6em;bottom:4%;height:4.2em;border:.2em solid #ffd23f;border-radius:1em;color:#fff;font:900 1em Tajawal,system-ui;z-index:2;cursor:pointer;touch-action:none;background:linear-gradient(to top,#d8461a var(--p,100%),#3a1a10cc var(--p,100%))}
#sk{left:1em;min-width:10em;padding:0 .8em;background:linear-gradient(to top,#18b5d6 var(--p,100%),#223c var(--p,100%))}
.mv{width:4.6em;background:#1b1026cc;font-size:1.2em;height:3.5em}#ml{right:6em}#mr{right:.8em}#sl{right:.8em;background:#1f3d5acc}
.scr{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:1.1em 1.4em .9em;z-index:4}
#mn{background:radial-gradient(ellipse at 50% 45%,#2a0a3a88,#000e 80%)}
.top{display:flex;width:100%;align-items:center;justify-content:space-between;gap:1em}
h1{margin:0;font-size:2.6em;white-space:nowrap;line-height:1.1;background:linear-gradient(90deg,#ff4b2b,#ffd23f,#ff4b2b);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900;filter:drop-shadow(0 .1em 0 #400);animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200%}}
.sub{margin:.1em 0 0;color:#7ee7ff;font-size:.95em}
.chip{background:#000b;border:.13em solid #ffd23f88;border-radius:2em;padding:.3em .9em;font-weight:900;white-space:nowrap;display:flex;align-items:center;gap:.45em;font-size:1.05em;min-width:7.5em;justify-content:center}
.xpb{display:inline-block;width:5.5em;height:.55em;background:#fff2;border-radius:1em;overflow:hidden}.xpb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1fc6ff,#00ffcc);transition:width .4s}
#cards{display:flex;gap:1.1%;justify-content:center;width:100%}
.c{position:relative;flex:1;max-width:17.5%;background:#1b1026e6;border:.2em solid #3b214f;border-radius:.8em;padding:.4em .2em .35em;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;font-size:1em;transition:transform .15s,border-color .15s}
.c img{height:6.3em;image-rendering:pixelated;filter:drop-shadow(0 .2em .2em #000)}.c small{color:#7ee7ff;font-size:.78em}
.c.on{border-color:#00ffcc;background:#00ffcc26;transform:scale(1.06)}
.c .lk{position:absolute;inset:0;background:#000b;border-radius:.6em;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffd23f;font-weight:900;gap:.2em;font-size:1.05em}
.c.own .lk{display:none}
#dsc{color:#ffd23f;font-weight:700;font-size:1.02em;min-height:1.3em}
.row{display:flex;justify-content:center;align-items:center;flex-wrap:wrap}
#tip{color:#b9a8d0;font-size:.85em;margin:0}
.badge{background:#ff3b3b;border-radius:1em;padding:0 .4em;font-size:.8em;margin-inline-start:.3em}
.ov{inset:0;display:flex;align-items:center;justify-content:center;background:#000c;z-index:6;backdrop-filter:blur(2px)}
.pn{background:linear-gradient(#1d0d2b,#120818);border:.25em solid #ffd23f;border-radius:1.1em;padding:1em 1.5em;max-width:88%;max-height:92%;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 0 40px #ff4b2b55;animation:pop .25s ease-out}
.pn.wide{min-width:56%}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.pn h2{margin:0 0 .3em;font-size:1.9em}
.scroll{overflow-y:auto;width:100%;max-height:60cqh;max-height:22em;margin:.3em 0;padding:0 .2em}
#msc{font-size:3em;font-weight:900;color:#ffd23f;line-height:1;text-shadow:0 .08em 0 #600}
#mnb{color:#00ffcc;font-weight:900;font-size:1.2em;animation:pulse 1s infinite}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.3em .8em;margin:.5em 0;font-size:1em}
.stats div{background:#ffffff0d;border-radius:.5em;padding:.2em .6em;white-space:nowrap}
.stats b{color:#ffd23f}
.mdn{color:#00ffcc;font-size:.95em;margin:.1em 0}
.lvr{width:80%;margin:.3em 0;font-size:.95em}.lvr .xpb{width:100%;height:.7em}
.up,.ms{display:flex;align-items:center;justify-content:space-between;gap:1em;background:#ffffff0a;border:1px solid #ffffff1a;border-radius:.7em;padding:.4em .8em;margin:.3em 0;text-align:start}
.up .ut,.ms>div{flex:1}.up small,.ms small{display:block;color:#b9a8d0;font-size:.85em}
.pips{display:flex;gap:.25em;margin-top:.2em}.pips i{width:1.4em;height:.45em;border-radius:.3em;background:#ffffff22}.pips i.on{background:#00ffcc}
.bar{height:.5em;background:#ffffff1a;border-radius:1em;overflow:hidden;margin:.25em 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff6a1a)}
.ms.dn{border-color:#00ffcc;background:#00ffcc14}.ms.dn .bar i{background:#00ffcc}
.rw{color:#ffd23f;font-weight:900;white-space:nowrap}
.note{color:#b9a8d0;font-size:.85em}
.bankl{font-weight:900;color:#ffd23f;font-size:1.2em}
table{width:100%;border-collapse:collapse}td,th{padding:.3em .5em;border-bottom:1px solid #ffffff14}th{color:#7ee7ff}td:first-child{color:#ffd23f;font-weight:900}
.ring{width:3.4em;height:3.4em;border-radius:50%;border:.3em solid #ffd23f;display:flex;align-items:center;justify-content:center;font-size:1.6em;font-weight:900;margin:.3em}
.set{display:flex;justify-content:space-between;align-items:center;gap:1.5em;width:100%;margin:.25em 0}
#toast{top:4.5em;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.3em;z-index:9;pointer-events:none}
.tst{background:#000d;border:.15em solid #00ffcc;border-radius:2em;padding:.35em 1.1em;font-weight:900;white-space:nowrap;animation:tst 2.6s ease forwards}
@keyframes tst{0%{opacity:0;transform:translateY(-.8em)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#08030f;align-items:center;justify-content:center;font:900 22px Tajawal,system-ui;text-align:center;padding:20px}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
#ld{inset:0;display:flex;align-items:center;justify-content:center;background:#08030f;z-index:20;font-weight:900;font-size:1.6em;color:#ffd23f}

$('bTop').onclick=()=>{const T=SV.st;openPanel('🏆 أحسن النتائج',(SV.top.length?`<table><tr><th>#</th><th>النقاط</th><th>الشخصية</th><th>العالم</th><th>المسافة</th></tr>${SV.top.map((r,i)=>`<tr><td>${i+1}</td><td>${r.s.toLocaleString('en')}</td><td>${CH[r.c].n}</td><td>${r.w}</td><td>${r.d} م</td></tr>`).join('')}</table>`:'<p>مازال ما لعبتي حتى جولة 🙂</p>')+
 `<div class="stats" style="margin-top:.8em"><div>🎮 الجولات: <b>${T.runs}</b></div><div>📏 المسافة: <b>${T.dist} م</b></div><div>🧍 الناجين: <b>${T.sur}</b></div><div>⚡ الطاقة: <b>${T.coins}</b></div><div>🪨 العمالقة: <b>${T.boss}</b></div><div>🌍 أبعد عالم: <b>${T.worlds}</b></div></div>`)};
function setBtns(){$('psmu').textContent=(SV.set.mus?'🎵':'🔇')+' الموسيقى';$('pssf').textContent=(SV.set.sfx?'🔊':'🔈')+' الأصوات'}
$('psmu').onclick=()=>{SV.set.mus^=1;save();setBtns()};$('pssf').onclick=()=>{SV.set.sfx^=1;save();setBtns()};
function setHTML(){const s=SV.set,q={auto:'تلقائي',high:'عالية',low:'أداء'};return `<div class="set"><span>🎵 الموسيقى</span><button class="b s ${s.mus?'g':'off'}" data-s="mus">${s.mus?'شاعلة':'طافية'}</button></div>
 <div class="set"><span>🔊 الأصوات</span><button class="b s ${s.sfx?'g':'off'}" data-s="sfx">${s.sfx?'شاعلة':'طافية'}</button></div>
 <div class="set"><span>📳 الاهتزاز</span><button class="b s ${s.vib?'g':'off'}" data-s="vib">${s.vib?'شاعل':'طافي'}</button></div>
 <div class="set"><span>🖥️ جودة الرسوم</span><button class="b s g" data-s="q">${q[s.q]}</button></div><p class="note">"أداء" كتنقص الإضاءة والجزيئات باش اللعبة تكون أسرع فالتيليفونات القديمة</p>`}
$('bSet').onclick=()=>{openPanel('⚙️ الإعدادات',setHTML());$('pvc').onclick=setClick};
function setClick(e){const b=e.target.closest('[data-s]');if(!b)return;const k=b.dataset.s;if(k==='q'){const o=['auto','high','low'];SV.set.q=o[(o.indexOf(SV.set.q)+1)%3];autoLow=false;applyQ()}else SV.set[k]^=1;save();$('pvc').innerHTML=setHTML();SFX.ui()}
const shopClick=$('pvc').onclick;
['bShop','bMis','bTop'].forEach(id=>{const f=$(id).onclick;$(id).onclick=()=>{$('pvc').onclick=shopClick;f()}});
$('bDaily').onclick=()=>daily(true);
function daily(force){const t=today();if(SV.daily.d===t)return;const n=SV.daily.d===today(-1)?SV.daily.n+1:1,r=40+Math.min(7,n)*20;
 openPanel('🎁 هدية اليوم',`<p style="font-size:1.3em">اليوم <b style="color:#ffd23f">${n}</b> على التوالي 🔥</p><div class="row">${[1,2,3,4,5,6,7].map(d=>`<div class="chip" style="min-width:3.2em;margin:.15em;${d<=Math.min(7,n)?'border-color:#00ffcc;color:#00ffcc':'opacity:.5'}">${d}<br>⚡${40+d*20}</div>`).join('')}</div><p class="note">رجع كل نهار باش الهدية تكبر</p><button class="b g big" id="dcl">خود ⚡${r}</button>`);
 $('dcl').onclick=()=>{SV.daily={d:t,n};SV.bank+=r;save();$('pv').hidden=true;renderMenu();SFX.buy();toast('🎁 +⚡'+r)}}

/* ---------------------------- LOOP ---------------------------- */
let last=performance.now(),fpsA=0,fpsN=0;
function loop(t){requestAnimationFrame(loop);let dt=(t-last)/1000;last=t;if(dt>.25)dt=.25;if(dt<0)dt=0;
 if(paused)return;
 if(st==='play'){fpsA+=dt;fpsN++;if(fpsA>3){if(SV.set.q==='auto'&&!autoLow&&fpsA/fpsN>1/40){autoLow=true;applyQ();toast('⚙️ تفعّل وضع الأداء باش اللعبة تكون أسرع')}fpsA=0;fpsN=0}}
 if(st==='play'||st==='dying'){acc+=Math.min(dt,.1);let n=0;while(acc>=STEP&&n<14){upd(STEP);acc-=STEP;n++;if(st!=='play'&&st!=='dying')break}if(n>=14)acc=0}
 else{S.t+=dt;updFx(dt);updP(dt);if(st==='menu'){S.cam+=90*dt;const p=S.pl;if(Math.random()<dt*30)part(p.x-14,G,rnd(-90,-30),rnd(-70,-20),.35,'#8a7a9a')}}
 if(st==='play')uiTick();draw()}
buildCards();applyQ();renderMenu();
Promise.all(ready).then(()=>{LOADED=true;bgFor(0);golemFor(0);groundFor(0);waveFor(0);$('ld').hidden=true;if(SV.daily.d!==today())setTimeout(()=>{if(st==='menu'&&$('pv').hidden)daily()},500);
 if(SV.seen.vet===1){SV.seen.vet=2;save();toast('🎉 مرحبا بك من جديد! عطيناك ⚡ على إنجازاتك القديمة')}});
document.fonts&&document.fonts.ready.then(()=>{lf=''});
requestAnimationFrame(loop);

</script></body></html>
